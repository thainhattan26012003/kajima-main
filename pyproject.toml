[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kajima-construction"
version = "0.1.0"
description = "Soil analysis for Kajima Construction"
readme = "README.md"
requires-python = ">=3.10,<4.0"

dependencies = [
  "numpy>=2.2.0",
  "matplotlib>=3.4.0",
  "pandas>=2.2.0",
  "gradio>=5.20.0",
  "opencv-python>=4.5.0",
  "wandb>=0.19.0",
  "fastapi>0.115.0",
  "mangum>=0.19.0",
  "pydantic>=2.10.6",
  "aws-lambda-powertools>=3.8.0",
  "boto3>=1.37.0",
  "python-jose (>=3.4.0,<4.0.0)",
]

[tool.poetry.group.batch_processor.dependencies]
scikit-learn = ">=1.6.0"
transformers = ">=4.47.0,<4.48.0"
torch = { version = "2.6.0" , source = "torch" }
torchvision = { version = "0.21.0" , source = "torch" }
peft = ">=0.14.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.3.0"
black = ">=25.1.0"
flake8 = ">=7.1.0"
isort = ">=6.0.0"
mypy = ">=1.15.0"
pre-commit = ">=4.1.0"

[tool.poetry.group.notebook.dependencies]
jupyter-resource-usage = ">=1.1.0"
jupyterlab = ">=4.3.0"
jupyterlab-widgets = ">=3.0.0"
ipykernel = ">=6.0.0"
jupyter = ">=1.0.0"

[[tool.poetry.source]]
name = "torch"
url = "https://download.pytorch.org/whl/cpu"
priority = "explicit"

[tool.poetry]
package-mode = false

[tool.poetry.requires-plugins]
poetry-plugin-export = ">=1.8"
