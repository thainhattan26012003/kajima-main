name: kajima-construction-gpu
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip
  - numpy>=2.2.0
  
  # Thư viện chính cho GPU
  - pytorch
  - torchvision
  - pytorch-cuda=12.4
  
  # Driver hỗ trợ
  - cuda-toolkit
  - cuda-nvcc

  # PIL/Pillow + libtiff (fix libtiff.so.5 on Linux; conda Pillow links to conda libtiff)
  - libtiff
  - pillow

  - pip:
    # Web / API
    - gradio>=5.20.0
    - fastapi>0.115.0
    - mangum>=0.19.0
    - pydantic>=2.10.6

    # AWS
    - boto3>=1.37.0
    - aws-lambda-powertools>=3.8.0

    # Vision / ML
    - scikit-learn>=1.6.0
    - opencv-python>=4.5.0
    - transformers>=4.47.0,<4.48.0
    - peft>=0.14.0

    # Auth / utils
    - python-jose>=3.4.0,<4.0.0

    # Logging / experiment
    - wandb>=0.19.0

    # Dev / Tools
    - pytest>=8.3.0
    - black>=25.1.0
    - jupyterlab>=4.3.0